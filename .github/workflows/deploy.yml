name: F4 Deployment Simulator

on:
  push:
    branches: [ "feature/f4-deployment-errors" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Deployment Validation
        run: |
          # Check if the state file exists, extract the scenario, and run the app
          if [ -f state_f4.json ]; then
            SCENARIO=$(jq -r '.scenario' state_f4.json)
            echo "Extracted scenario: $SCENARIO"
            export FAIL_ON=$SCENARIO
          fi
          python app.py